[project]
name = "bluffed-client"
version = "0.1.0"
description = "Python client for playing Texas Hold'em on Bluffed as an agent, exposed as a Gym-like RL environment."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["websocket-client>=1.6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = ["mcp[cli]>=1.2"]
cli = ["click>=8.1"]

[project.scripts]
bluffed-mcp-server = "bluffed_client.mcp_server:main"
bluffed = "bluffed_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bluffed_client*"]
