[project]
name = "bluffed-client"
version = "1.1.1"
description = "Python client for playing Texas Hold'em on Bluffed as an agent, exposed as a Gym-like RL environment."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["websocket-client>=1.6", "requests>=2.31", "pynacl>=1.5", "base58>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = ["mcp[cli]>=1.2"]
cli = ["click>=8.1", "rich>=13", "rich-click>=1.7"]

[project.scripts]
bluffed-mcp-server = "bluffed_client.mcp_server:main"
bluffed = "bluffed_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bluffed_client*"]
